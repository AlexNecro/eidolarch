<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Eidolarch</title><link rel="manifest" href="/manifest.json?v=2.3.0"><link rel="icon" href="/favicon.ico?v=2.3.0" sizes="any"><link rel="apple-touch-icon" href="/favicon.ico?v=2.3.0"><link rel="stylesheet" href="/assets/app.css?v=2.3.0"></head><body>
<header class="topbar">
  <button id="brandHome" class="brand brandbtn" title="Eidolarch"><img class="brandmark" src="/assets/icons/app-mark.svg?v=2.3.0" alt=""><span class="brandtext">Eidolarch</span> <span class="badge">v2.3.0</span></button>
  <div class="history"><button id="backBtn" class="iconbtn ghost" title="Back">←</button><button id="forwardBtn" class="iconbtn ghost" title="Forward">→</button></div>
  <form id="searchForm" class="searchbar"><div class="searchbox"><input id="search" autocomplete="off"><button id="clearSearch" type="button" class="searchclear hidden" aria-label="Clear">×</button></div><button type="submit" id="searchSubmit"></button></form>
  <div class="toptools"><button id="helpBtn" class="iconbtn ghost" title="Help">?</button><button id="graphBtn" class="iconbtn ghost" title="Graph">⌘</button><button id="networkBtn" class="iconbtn ghost qrbtn" title="LAN" aria-label="LAN"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm9-2h7v7h-7V3Zm2 2v3h3V5h-3ZM3 14h7v7H3v-7Zm2 2v3h3v-3H5Zm9-2h3v3h-3v-3Zm4 0h3v7h-3v-3h-2v3h-2v-5h4v-2Zm-4 4h2v3h-2v-3Z"/></svg></button><button id="jobsBtn" class="iconbtn ghost" title="Jobs">◴</button><button id="settingsBtn" class="iconbtn ghost" title="Settings">⚙</button><button id="newWindow" class="iconbtn" title="New window">▣</button></div>
</header>
<main>
<section class="browserbar">
  <div class="modes"><button id="modeFolders" class="mode active"></button><button id="modeTags" class="mode ghost"></button><button id="modeFavorites" class="mode ghost"></button><button id="modeDuplicates" class="mode ghost"></button></div><button id="addLibraryFolder" class="tiny-action ghost" type="button">＋ <span data-i18n="settings.addFolder"></span></button>
  <div id="crumbs" class="crumbs"></div><button id="newFolderBtn" class="tinybtn ghost hidden" title="New folder">＋📁</button><div class="spacer"></div>
  <div class="listtools"><select id="sortSelect" class="compact-select"></select><div class="view-switch"><button data-view="grid" class="active">▦</button><button data-view="content">▤</button><button data-view="details">☷</button></div></div><button id="toggleNavPanel" class="navtoggle ghost hidden" type="button">▴</button>
</section>
<section id="navPanel" class="navpanel"></section>
<section class="statusline"><span id="resultTitle"></span><span id="count"></span><span id="selectionCount" class="selection-count hidden"></span><span class="spacer"></span><button id="resetAll" class="textbtn hidden">× Reset</button><span id="modelState"></span></section>
<section id="progressWrap" class="progresswrap hidden"><div class="progress-head"><strong id="progressTitle"></strong><span class="spinner"></span><button id="pauseIndex" class="tinybtn ghost">⏸</button></div><div class="progress"><div id="progressBar"></div></div><div id="progressText"></div><div id="progressError" class="errorbox hidden"></div></section>
<section id="bulkbar" class="bulkbar hidden"><button data-op="copy"></button><button data-op="move"></button><button data-op="tag"></button><button data-op="delete" class="danger"></button><button data-op="cancel" class="ghost"></button><button data-op="undo" class="ghost"></button></section>
<section id="onboarding" class="onboarding hidden"><div class="onboarding-card"><div class="onboarding-icon">▣</div><h2 data-i18n="onboarding.title"></h2><p data-i18n="onboarding.text"></p><button id="onboardingAdd" data-i18n="settings.addFolder"></button></div></section><section id="grid" class="grid"></section><div id="empty" class="empty hidden"></div><div id="loadHint" class="loadhint hidden"></div>
</main>
<button id="scrollTopBtn" class="scroll-top hidden" type="button" title="Up">↑</button><div id="popover" class="popover hidden"></div><div id="uiTooltip" class="ui-tooltip hidden" role="tooltip"></div><div id="toast" class="toast hidden"></div>
<aside id="drawer" class="drawer hidden"><div class="drawer-card"><div class="drawer-head"><h2 data-i18n="settings.title"></h2><button id="closeDrawer" class="iconbtn">×</button></div>
<nav class="settings-tabs" id="settingsTabs"><button class="active" data-settings-tab="library" data-i18n="settings.tabLibrary"></button><button data-settings-tab="ai" data-i18n="settings.tabAI"></button><button data-settings-tab="network" data-i18n="settings.tabNetwork"></button><button data-settings-tab="interface" data-i18n="settings.tabInterface"></button><button data-settings-tab="diagnostics" data-i18n="settings.tabDiagnostics"></button></nav>
<div class="settings-panel" data-settings-panel="library"><section class="settings-section"><h3 data-i18n="settings.library"></h3><div class="addfolder"><input id="folderPath" placeholder="D:\Photos or \\NAS\Photos"><button id="pickFolder" class="ghost" data-i18n="settings.chooseFolder"></button><button id="addFolder" data-i18n="settings.addFolder"></button></div><div id="folderList" class="folderlist"></div><div class="actions"><button id="startIndex" data-i18n="settings.indexNow"></button><button id="rebuildTags" class="ghost" data-i18n="settings.rebuildTags"></button><button id="refreshInfo" class="ghost">↻</button></div></section>
<section class="settings-section"><h3 data-i18n="settings.duplicatePriority"></h3><p class="small muted" data-i18n="settings.duplicatePriorityHint"></p><textarea id="duplicatePriorityRules" rows="7" placeholder="+100|N:\YandexDisk\Photo&#10;-50|N:\YandexDisk\Фотокамера"></textarea><div class="actions"><button id="saveDuplicatePriority" data-i18n="settings.save"></button></div></section></div>
<div class="settings-panel hidden" data-settings-panel="ai"><section class="settings-section"><h3 data-i18n="settings.ai"></h3><label><span data-i18n="settings.backend"></span><select id="aiBackend"><option value="auto">Auto</option><option value="local">Local</option><option value="remote">Remote API</option></select></label><label><span data-i18n="settings.localModel"></span><select id="aiProfile"><option value="auto">Auto</option><option value="fast">Fast</option><option value="quality">Quality</option></select></label><label><span data-i18n="settings.device"></span><select id="aiDevice"><option value="auto">Auto</option><option value="cuda">CUDA / GPU</option><option value="cpu">CPU</option></select></label><label><span data-i18n="settings.intensity"></span><select id="intensity"><option value="performance" data-i18n="settings.performance"></option><option value="balanced" data-i18n="settings.balanced"></option><option value="eco" data-i18n="settings.eco"></option></select></label><div id="remoteSettings" class="remote-settings hidden"><label>Remote URL<input id="remoteUrl"></label><label>Model ID<input id="remoteModel"></label><label>API key<input id="remoteKey" type="password"></label></div><div class="actions"><button id="saveAi" data-i18n="settings.save"></button><button id="loadAi" class="ghost" data-i18n="settings.load"></button></div><div class="small muted" data-i18n="settings.performanceHint"></div><div id="aiInfo" class="aiinfo"></div></section></div>
<div class="settings-panel hidden" data-settings-panel="network"><section class="settings-section"><h3 data-i18n="settings.network"></h3><label class="checkrow"><span data-i18n="settings.lanEnabled"></span><input id="lanEnabled" type="checkbox" checked></label><label class="checkrow"><span data-i18n="settings.lanReadOnly"></span><input id="lanReadOnly" type="checkbox" checked></label><label class="checkrow"><span data-i18n="settings.allowOriginal"></span><input id="allowOriginal" type="checkbox" checked></label><label><span data-i18n="settings.publicUrl"></span><input id="publicUrl" placeholder="https://photos.example.org"></label><p class="small muted" data-i18n="settings.publicUrlHint"></p><div class="actions"><button id="saveLan" data-i18n="settings.save"></button></div></section></div>
<div class="settings-panel hidden" data-settings-panel="interface"><section class="settings-section"><h3 data-i18n="settings.appearance"></h3><label><span data-i18n="settings.theme"></span><select id="uiTheme"><option value="system" data-i18n="settings.themeSystem"></option><option value="dark" data-i18n="settings.themeDark"></option><option value="light" data-i18n="settings.themeLight"></option></select></label><label><span data-i18n="settings.language"></span><select id="uiLanguage"><option value="auto" data-i18n="settings.languageAuto"></option><option value="ru">Русский</option><option value="en">English</option></select></label><label class="checkrow"><span data-i18n="settings.colorDiff"></span><input id="colorDiff" type="checkbox"></label><label class="checkrow"><span data-i18n="settings.motion"></span><input id="gridMotion" type="checkbox"></label><div class="actions"><button id="installPwa" class="ghost" data-i18n="settings.installApp"></button></div><p class="small muted" data-i18n="settings.installAppHint"></p></section></div>
<div class="settings-panel hidden" data-settings-panel="diagnostics"><section class="settings-section"><h3 data-i18n="settings.diagnostics"></h3><div id="diagInfo" class="small muted"></div><div class="actions"><button id="copyDiagnostics" class="ghost" data-i18n="settings.copyDiagnostics"></button><button id="downloadErrorReport" class="ghost" data-i18n="settings.downloadErrorReport"></button></div></section><section class="settings-section"><h3 data-i18n="settings.storage"></h3><div id="storageInfo" class="small muted"></div><div class="actions"><button id="clearCache" class="ghost" data-i18n="settings.clearCache"></button><button id="backupDb" class="ghost" data-i18n="settings.backup"></button></div></section></div>
</div></aside>
<div id="helpOverlay" class="graph-overlay hidden"><div class="help-card"><div class="drawer-head"><h2 id="helpTitle">Eidolarch</h2><button id="closeHelp" class="iconbtn">×</button></div><iframe id="helpFrame" class="help-frame" title="Eidolarch Help"></iframe></div></div><div id="graphOverlay" class="graph-overlay hidden"><div class="graph-card"><div class="drawer-head"><h2 data-i18n="graph.title"></h2><button id="closeGraph" class="iconbtn">×</button></div><div id="graphCanvas" class="graph-canvas"></div></div></div><div id="viewer" class="viewer hidden"><button id="closeViewer" class="viewer-close">×</button><button id="viewerPrev" class="viewer-nav prev">‹</button><button id="viewerNext" class="viewer-nav next">›</button><div class="viewer-stage"><img id="viewerImg" alt=""><div id="viewerCaption" class="viewer-caption"></div></div><aside class="viewer-side"><div class="viewer-actions"><button id="infoBtn" class="viewer-tab active" data-i18n="viewer.info"></button><button id="objectsBtn" class="viewer-tab ghost" data-i18n="viewer.objects"></button><button id="similarBtn" class="viewer-tab ghost" data-i18n="viewer.similar"></button><button id="duplicatesBtn" class="viewer-tab ghost" data-i18n="viewer.duplicates"></button></div><div id="viewerSideTitle" class="viewer-side-title"></div><div id="viewerSideContent"></div></aside></div>
<script src="/assets/app.js?v=2.3.0"></script></body></html>
